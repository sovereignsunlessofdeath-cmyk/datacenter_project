<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Complete Your Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, rgb(26, 26, 26) 0%, rgb(40, 40, 40) 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { max-width: 500px; width: 100%; }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        h1 { 
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .user-info {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        .form-group { 
            margin-bottom: 20px;
        }
        label { 
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
        }
        input { 
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }
        input:focus { 
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button { 
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            border: none; 
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .help-text {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
            line-height: 1.6;
        }
        .error {
            background: rgb(242, 222, 222);
            color: rgb(169, 68, 66);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid rgb(231, 76, 60);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>👤 Complete Your Profile</h1>
            <p class="subtitle">Add your email to receive ticket responses</p>
            
            <div class="user-info">
                Staff: <strong>{{ staff_name }}</strong>
            </div>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form action="/profile" method="POST">
                <div class="form-group">
                    <label for="email">Your Email *</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" value="{{ email }}" required>
                </div>

                <button type="submit">✓ Save Email & Continue</button>
            </form>

            <p class="help-text">
                Your email will be used to send you notifications<br>
                when IT staff responds to your support tickets.
            </p>
        </div>
    </div>
</body>
</html>
